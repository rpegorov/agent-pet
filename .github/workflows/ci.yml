name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - run: python3 -m unittest discover -s Tests/scripts
      - run: node --test plugins/dsh-agent-pet/test
